<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEM AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
      .md p { margin-bottom: 0.5rem; }
      .md ul { list-style: disc; margin: 0.5rem 0 0.5rem 1.5rem; }
      .md ol { list-style: decimal; margin: 0.5rem 0 0.5rem 1.5rem; }
      .md h1, .md h2, .md h3, .md h4 { font-weight: 700; margin: 0.75rem 0 0.25rem; }
      .md h1 { font-size: 1.25rem; }
      .md h2 { font-size: 1.125rem; }
      .md code { background: #f3f4f6; padding: 0 0.25rem; border-radius: 0.25rem; }
      .md pre { background: #f3f4f6; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
      .md pre code { background: none; padding: 0; }
    </style>
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="max-w-3xl mx-auto p-4">
      <h1 class="text-3xl font-bold text-orange-600 text-center mb-6">🎓 STEM AI Tutor</h1>

      <div class="flex flex-col sm:flex-row gap-2 justify-center mb-4">
        <select id="mode" class="p-2 border rounded">
          <option value="math">Math</option>
          <option value="science">Science</option>
          <option value="tech">Technology</option>
          <option value="engineering">Engineering</option>
        </select>
        <input type="text" id="question" placeholder="Ask a question..." class="flex-1 p-2 border rounded" />
        <button onclick="askTutor()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Ask</button>
      </div>

      <div class="flex flex-col sm:flex-row gap-2 justify-center mb-6">
        <input type="number" id="num-questions" placeholder="How many quiz questions?" class="p-2 border rounded" />
        <button onclick="startQuiz()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Start Quiz</button>
      </div>

      <div id="chat-box" class="bg-white h-96 overflow-y-auto p-4 rounded shadow mb-4"></div>

      <div id="quiz-answer-container" class="fixed bottom-0 left-0 w-full bg-white p-4 border-t hidden">
        <div class="max-w-3xl mx-auto flex gap-2">
          <input type="text" id="quiz-answer" placeholder="Enter your answer..." class="flex-1 p-2 border rounded" />
          <button onclick="submitQuizAnswer()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">Submit</button>
        </div>
      </div>
    </div>

    <script>
      // Turn plain text into safe HTML (for what the user types)
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Turn Markdown from the AI into safe HTML
      function renderMarkdown(text) {
        const html = marked.parse(String(text ?? ""), { breaks: true });
        return DOMPurify.sanitize(html);
      }

      function askTutor() {
        let question = document.getElementById("question").value;
        let mode = document.getElementById("mode").value;
        let chatBox = document.getElementById("chat-box");

        if (!question) {
          alert("Please enter a question!");
          return;
        }

        chatBox.innerHTML += `<p class='mb-2'><strong>You:</strong> ${escapeHtml(question)}</p>`;

        fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question, mode: mode }),
        })
          .then((response) => response.json())
          .then((data) => {
            chatBox.innerHTML += `<div class='mb-2 md'><strong>AI:</strong> ${renderMarkdown(data.response || data.error)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
          });

        document.getElementById("question").value = "";
      }

      function startQuiz() {
        let numQuestions = document.getElementById("num-questions").value;
        let mode = document.getElementById("mode").value;
        let chatBox = document.getElementById("chat-box");

        if (!numQuestions || numQuestions < 1) {
          alert("Please enter a valid number of questions!");
          return;
        }

        fetch("/start_quiz", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ num_questions: numQuestions, mode: mode }),
        })
          .then((response) => response.json())
          .then((data) => {
            chatBox.innerHTML += `<div class='mb-2 md'><strong>Quiz Question:</strong> ${renderMarkdown(data.question)}</div>`;
            document.getElementById("quiz-answer-container").style.display = "block";
          });
      }

      function submitQuizAnswer() {
        let answer = document.getElementById("quiz-answer").value;
        let chatBox = document.getElementById("chat-box");

        if (!answer) {
          alert("Please enter an answer!");
          return;
        }

        chatBox.innerHTML += `<p class='mb-2'><strong>You:</strong> ${escapeHtml(answer)}</p>`;

        fetch("/check_answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answer: answer }),
        })
          .then((response) => response.json())
          .then((data) => {
            chatBox.innerHTML += `<div class='mb-2 md'><strong>AI:</strong> ${renderMarkdown(data.response)}</div>`;
            if (data.explanation) {
              chatBox.innerHTML += `<div class='mb-2 md'><strong>Explanation:</strong> ${renderMarkdown(data.explanation)}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;

            document.getElementById("quiz-answer").value = "";

            if (data.response.includes("Quiz Over")) {
              document.getElementById("quiz-answer-container").style.display = "none";
            }
          });
      }
    </script>
  </body>
</html>
